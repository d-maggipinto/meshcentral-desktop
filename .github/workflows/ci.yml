name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Least privilege: the build has a read-only token; only the release job (version tags) can write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to full commit SHAs (a tag can be moved by the action's owner).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false  # the build steps do not need the token in .git/config

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-gi python3-websocket \
            python3-cairo gir1.2-gtk-3.0 gir1.2-vte-2.91 gir1.2-secret-1 gir1.2-webkit2-4.1 \
            fakeroot dpkg-dev

      - name: Syntax check
        run: python3 -m compileall -q pkg/usr/share/meshcentral-desktop

      - name: Build package
        run: scripts/build-deb.sh

      - name: Check package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: meshcentral-desktop-deb
          path: dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # create the release and upload its files
      id-token: write       # sign the build provenance (Sigstore)
      attestations: write   # store the provenance on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: meshcentral-desktop-deb
          path: dist

      - name: Source archives and checksums
        run: |
          VER="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="meshcentral-desktop-$VER/" -o "dist/meshcentral-desktop-$VER.tar.gz" "$GITHUB_REF_NAME"
          git archive --format=zip --prefix="meshcentral-desktop-$VER/" -o "dist/meshcentral-desktop-$VER.zip" "$GITHUB_REF_NAME"
          (cd dist && sha256sum *.deb *.tar.gz *.zip > SHA256SUMS && cat SHA256SUMS)

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.zip

      - name: Release notes from CHANGELOG.md
        run: |
          VER="${GITHUB_REF_NAME#v}"
          {
            echo "## Changes"
            echo
            awk -v v="$VER" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md
            echo
            echo "## Downloads"
            echo
            echo "- \`meshcentral-desktop_${VER}_all.deb\`: Debian package (\`sudo apt install ./meshcentral-desktop_${VER}_all.deb\`)"
            echo "- \`meshcentral-desktop-${VER}.tar.gz\`, \`meshcentral-desktop-${VER}.zip\`: source code"
            echo "- \`SHA256SUMS\`: checksums, verify with \`sha256sum -c SHA256SUMS\`"
            echo "- Build provenance: \`gh attestation verify meshcentral-desktop_${VER}_all.deb --repo ${GITHUB_REPOSITORY}\`"
          } > release-notes.md
          grep -q . release-notes.md

      - name: Attach package to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3
        with:
          name: MeshCentral Desktop ${{ github.ref_name }}
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          body_path: release-notes.md
