name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege: the build has a read-only token; only the release job (version tags) can write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to full commit SHAs (a tag can be moved by the action's owner).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false  # the build steps do not need the token in .git/config

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-gi python3-websocket \
            python3-cairo gir1.2-gtk-3.0 gir1.2-vte-2.91 gir1.2-secret-1 gir1.2-webkit2-4.1 \
            fakeroot dpkg-dev

      - name: Syntax check
        run: python3 -m compileall -q pkg/usr/share/meshcentral-desktop

      - name: Build package
        run: scripts/build-deb.sh

      - name: Check package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: meshcentral-desktop-deb
          path: dist/*.deb

  # Builds, self-tests and packages the Windows app: the job whose installers the release publishes.
  # It never runs third-party server code (the MeshCentral server from npm and its agent run in windows-app).
  windows:
    runs-on: windows-2025
    env:
      PYTHONUTF8: "1"     # UTF-8 stdout / files (the Windows default code page cannot print every character)
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Actions are pinned to full commit SHAs (a tag can be moved by the action's owner).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            unzip
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-python-websocket-client
            mingw-w64-ucrt-x86_64-python-comtypes
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-pyinstaller
            mingw-w64-ucrt-x86_64-pyinstaller-hooks-contrib
            mingw-w64-ucrt-x86_64-python-pip

      # qrcode (2FA setup QR code) is not packaged by MSYS2: from PyPI, pinned by version and hash
      - name: Python packages from PyPI
        run: python -m pip install --break-system-packages --no-deps --require-hashes -r scripts/windows/requirements-pypi.txt

      # WebView2 SDK and xterm.js, pinned by version AND SHA-256 (see the script)
      - name: Third-party files
        run: scripts/windows/fetch-assets.sh

      - name: Syntax check
        run: python -m compileall -q pkg/usr/share/meshcentral-desktop scripts/windows

      - name: WebView2 inside GTK
        run: |
          export MCD_WEBVIEW2_DIR="$(cygpath -w "$PWD/build/webview2")"
          mkdir -p smoke && cd smoke
          timeout 180 python ../scripts/windows/webview2_smoke.py 2>&1 | tee smoke.log
          exit ${PIPESTATUS[0]}

      - name: Terminal (xterm.js in WebView2)
        run: |
          export MCD_WEBVIEW2_DIR="$(cygpath -w "$PWD/build/webview2")"
          export MCD_ASSETS_DIR="$(cygpath -w "$PWD/build/assets")"
          cd smoke
          timeout 180 python ../scripts/windows/terminal_smoke.py 2>&1 | tee terminal.log
          exit ${PIPESTATUS[0]}

      # ---- packaging: PyInstaller folder -> Inno Setup .exe + WiX .msi, each installed and self-tested ----
      - name: Bundle (PyInstaller)
        run: scripts/windows/build.sh

      - name: Self-test of the bundled app and the portable .exe
        run: |
          ver=$(cat dist/VERSION)
          ./dist/MeshCentralDesktop/MeshCentralDesktop.exe --selftest "$(cygpath -w "$PWD/smoke/selftest-bundle.json")" || rc=$?
          ./dist/MeshCentralDesktop-$ver-portable.exe --selftest "$(cygpath -w "$PWD/smoke/selftest-portable.json")" || rc=$?
          for f in smoke/selftest-bundle.json smoke/selftest-portable.json; do
            echo "== $f"
            python -c "import json,sys;r=json.load(open(sys.argv[1]));[print(k, v if not isinstance(v,dict) else (v['ok'], v.get('value', v.get('error')))) for k,v in r.items() if k!='modules']" "$f"
          done
          exit ${rc:-0}

      - name: Sign the app and its libraries (when a code-signing certificate is configured)
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          # every binary: Windows 11 Smart App Control checks each DLL the app loads
          $files = (Get-ChildItem dist\MeshCentralDesktop -Recurse -Include *.exe, *.dll, *.pyd).FullName
          scripts/windows/sign.ps1 @files

      - name: Installers (Inno Setup .exe, WiX .msi)
        shell: pwsh
        run: |
          $ver = (Get-Content dist\VERSION).Trim()
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=$ver" packaging\windows\installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet tool install --global wix --version 5.0.2 | Out-Null
          wix extension add -g WixToolset.UI.wixext/5.0.2
          # absolute paths: WiX resolves relative ones from the .wxs folder
          wix build -arch x64 -ext WixToolset.UI.wixext -d Version=$ver -d "SourceDir=$PWD\dist\MeshCentralDesktop" `
            -d "Icon=$PWD\build\meshcentral-desktop.ico" -d "LicenseRtf=$PWD\build\LICENSE.rtf" `
            packaging\windows\MeshCentralDesktop.wxs -o "dist\MeshCentralDesktop-$ver.msi"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem dist\*.exe, dist\*.msi | Format-Table Name, Length
          foreach ($f in Get-ChildItem dist\*.exe, dist\*.msi) {
            if ($f.Length -lt 20MB) { "$($f.Name) is too small: the app folder was not packed"; exit 1 }
          }

      - name: Sign the installers (when a code-signing certificate is configured)
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          $files = (Get-ChildItem dist\*.exe, dist\*.msi).FullName
          scripts/windows/sign.ps1 @files

      - name: Install, self-test and uninstall both installers
        shell: pwsh
        run: |
          $ver = (Get-Content dist\VERSION).Trim()
          $fail = 0
          # setup .exe, per-user, silent
          $dir = "$env:LOCALAPPDATA\Programs\MCD-CI"
          Start-Process "dist\MeshCentralDesktop-$ver-setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/DIR=$dir","/LOG=smoke\setup-install.log" -Wait
          Start-Process "$dir\MeshCentralDesktop.exe" -ArgumentList "--selftest","$PWD\smoke\selftest-setup.json" -Wait -PassThru | ForEach-Object { if ($_.ExitCode) { $fail = 1; "setup.exe install: self-test failed" } else { "setup.exe install: self-test OK" } }
          $unins = Get-ChildItem "$dir\unins*.exe" | Select-Object -First 1
          Start-Process $unins.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait
          if (Test-Path "$dir\MeshCentralDesktop.exe") { $fail = 1; "setup.exe: uninstall left the app behind" } else { "setup.exe: uninstalled" }
          # .msi, per-machine, silent
          $p = Start-Process msiexec -ArgumentList "/i","dist\MeshCentralDesktop-$ver.msi","/qn","/l*v","smoke\msi-install.log" -Wait -PassThru
          "msiexec install exit code: $($p.ExitCode)"; if ($p.ExitCode) { $fail = 1 }
          $exe = "$env:ProgramFiles\MeshCentral Desktop\MeshCentralDesktop.exe"
          Start-Process $exe -ArgumentList "--selftest","$PWD\smoke\selftest-msi.json" -Wait -PassThru | ForEach-Object { if ($_.ExitCode) { $fail = 1; ".msi install: self-test failed" } else { ".msi install: self-test OK" } }
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\MeshCentral Desktop.lnk")) { $fail = 1; ".msi: Start menu shortcut missing" } else { ".msi: Start menu shortcut OK" }
          $p = Start-Process msiexec -ArgumentList "/x","dist\MeshCentralDesktop-$ver.msi","/qn" -Wait -PassThru
          if ((Test-Path $exe) -or $p.ExitCode) { $fail = 1; ".msi: uninstall failed" } else { ".msi: uninstalled" }
          exit $fail

      # The in-app upgrade, for real: the app's hidden helper waits for the app to exit, runs the installer
      # silently and starts the app again (updater.install_windows), for both installers.
      - name: In-app upgrade hand-over (install)
        shell: pwsh
        run: |
          $ver = (Get-Content dist\VERSION).Trim()
          Start-Process "dist\MeshCentralDesktop-$ver-setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/DIR=$env:LOCALAPPDATA\Programs\MCD-UPD" -Wait
          $p = Start-Process msiexec -ArgumentList "/i","dist\MeshCentralDesktop-$ver.msi","/qn" -Wait -PassThru
          if ($p.ExitCode -or -not (Test-Path "$env:LOCALAPPDATA\Programs\MCD-UPD\MeshCentralDesktop.exe")) { exit 1 }

      - name: In-app upgrade hand-over (setup .exe, then .msi)
        run: |
          ver=$(cat dist/VERSION)
          cd smoke
          inno_exe="$(cygpath -w "$LOCALAPPDATA")\Programs\MCD-UPD\MeshCentralDesktop.exe"
          msi_exe="$(cygpath -w "$PROGRAMFILES")\MeshCentral Desktop\MeshCentralDesktop.exe"
          python ../scripts/windows/updater_smoke.py inno "$(cygpath -w ../dist/MeshCentralDesktop-$ver-setup.exe)" "$inno_exe"
          powershell -NoProfile -ExecutionPolicy Bypass -File ../scripts/windows/updater_wait.ps1 -Exe "$inno_exe" -CopyListFile updater-inno.copy || rc=1
          python ../scripts/windows/updater_smoke.py msi "$(cygpath -w ../dist/MeshCentralDesktop-$ver.msi)" "$msi_exe"
          powershell -NoProfile -ExecutionPolicy Bypass -File ../scripts/windows/updater_wait.ps1 -Exe "$msi_exe" -CopyListFile updater-msi.copy || rc=1
          cp "$LOCALAPPDATA/MeshCentralDesktop/update.log" . 2>/dev/null && cat update.log
          # both installers must have succeeded, not only the restart
          [ "$(grep -c 'installer exit code: 0' update.log)" = 2 ] || { echo "an installer failed"; rc=1; }
          exit ${rc:-0}

      - name: In-app upgrade hand-over (clean up)
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path dist\VERSION)) { "nothing was installed"; exit 0 }
          $ver = (Get-Content dist\VERSION).Trim()
          Get-Process MeshCentralDesktop -ErrorAction SilentlyContinue | Stop-Process -Force
          $u = Get-ChildItem "$env:LOCALAPPDATA\Programs\MCD-UPD\unins*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($u) { Start-Process $u.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait }
          Start-Process msiexec -ArgumentList "/x","dist\MeshCentralDesktop-$ver.msi","/qn" -Wait

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: windows-installers
          path: |
            dist/*.exe
            dist/*.msi
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: windows-smoke
          path: |
            smoke/*.png
            smoke/*.log
            smoke/*.json
          if-no-files-found: ignore

  # The whole app against a throwaway local MeshCentral server (npm, pinned by a committed lockfile, no
  # install scripts) and a REAL Windows agent. Kept apart from the windows job: nothing it builds or runs
  # can reach the published installers; the release still waits for it to pass.
  windows-app:
    runs-on: windows-2025
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            unzip
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-python-websocket-client
            mingw-w64-ucrt-x86_64-python-comtypes
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-python-pip

      - name: Python packages from PyPI
        run: python -m pip install --break-system-packages --no-deps --require-hashes -r scripts/windows/requirements-pypi.txt

      - name: Third-party files
        run: scripts/windows/fetch-assets.sh

      - name: Local MeshCentral server (install, pinned)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force mc | Out-Null
          Copy-Item scripts\windows\ci-server\package.json, scripts\windows\ci-server\package-lock.json mc\
          Set-Location mc
          npm ci --ignore-scripts --no-audit --no-fund | Out-Null
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node node_modules/meshcentral/meshcentral --cert 127.0.0.1 --createaccount ciadmin --pass "Ci-Test-12345!"
          node node_modules/meshcentral/meshcentral --adminaccount ciadmin

      # One step: background processes do not survive the end of the step that started them.
      - name: App against the server and a real Windows agent
        run: |
          NODE="/c/Program Files/nodejs/node.exe"
          (cd mc && "$NODE" node_modules/meshcentral/meshcentral --cert 127.0.0.1 --port 8443 --redirport 8080 \
             --exactports > server.log 2> server.err &)
          for i in $(seq 1 120); do
            [ "$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:8443/)" = 200 ] && { echo "server up ($i)"; break; }
            sleep 2
          done
          python scripts/windows/ci_server.py https://127.0.0.1:8443 ciadmin 'Ci-Test-12345!' "$(cygpath -w "$PWD/agent")"
          (cd agent && ./meshagent.exe connect > agent.log 2> agent.err &)
          sleep 20
          export MCD_WEBVIEW2_DIR="$(cygpath -w "$PWD/build/webview2")"
          export MCD_ASSETS_DIR="$(cygpath -w "$PWD/build/assets")"
          mkdir -p smoke && cd smoke
          timeout 900 python ../scripts/windows/app_smoke.py https://127.0.0.1:8443 ciadmin 'Ci-Test-12345!' 2>&1 | tee app.log
          exit ${PIPESTATUS[0]}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: windows-app-smoke
          path: |
            smoke/*.png
            smoke/*.log
            mc/server.log
            mc/server.err
            agent/agent.log
            agent/agent.err
          if-no-files-found: ignore

  # Android app (android/): release build, shrunk with R8. On version tags it is signed with the release key
  # (repository secrets, only handed to this job on tags) and the signer certificate is checked against the
  # published fingerprint, so a release can never carry an APK signed with any other key.
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Third-party assets (xterm.js, pinned by SHA-256)
        run: android/scripts/fetch-assets.sh

      - name: Build
        env:
          KEYSTORE_B64: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MCD_KEYSTORE_B64 || '' }}
          MCD_KEYSTORE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MCD_KEYSTORE_PASSWORD || '' }}
          MCD_KEY_ALIAS: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MCD_KEY_ALIAS || '' }}
          MCD_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MCD_KEY_PASSWORD || '' }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            umask 077
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export MCD_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          cd android
          ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Check the APK
        run: |
          VER=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' pkg/usr/share/meshcentral-desktop/mcdesktop/__init__.py)
          OUT=android/app/build/outputs/apk/release
          ls -l "$OUT"
          if unzip -l "$OUT"/*.apk | grep -q rig_ca; then echo "APK contains the test certificate"; exit 1; fi
          mkdir -p dist
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
            "$APKSIGNER" verify --print-certs "$OUT/app-release.apk" | tee certs.txt
            # the release key's certificate (also published in docs/ANDROID.md)
            grep -qi "certificate SHA-256 digest: 03ccbf9ed4ea3eb98d0d258185201cf52046ad0ea7874298859bc1e2c7b5a8a0" certs.txt
            cp "$OUT/app-release.apk" "dist/MeshCentralDesktop-$VER-android.apk"
          else
            cp "$OUT"/*.apk dist/
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: android-apk
          path: dist/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows, windows-app, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # create the release and upload its files
      id-token: write       # sign the build provenance (Sigstore)
      attestations: write   # store the provenance on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # only commits that are on main are released (a version tag pushed on another branch is refused)
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: meshcentral-desktop-deb
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: windows-installers
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: android-apk
          path: dist

      - name: Source archives and checksums
        run: |
          VER="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="meshcentral-desktop-$VER/" -o "dist/meshcentral-desktop-$VER.tar.gz" "$GITHUB_REF_NAME"
          git archive --format=zip --prefix="meshcentral-desktop-$VER/" -o "dist/meshcentral-desktop-$VER.zip" "$GITHUB_REF_NAME"
          (cd dist && sha256sum *.deb *.exe *.msi *.apk *.tar.gz *.zip > SHA256SUMS && cat SHA256SUMS)

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.exe
            dist/*.msi
            dist/*.apk
            dist/*.tar.gz
            dist/*.zip

      - name: Release notes from CHANGELOG.md
        run: |
          VER="${GITHUB_REF_NAME#v}"
          {
            echo "## Changes"
            echo
            awk -v v="$VER" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md
            echo
            echo "## Downloads"
            echo
            echo "- \`meshcentral-desktop_${VER}_all.deb\`: Debian / Ubuntu package (\`sudo apt install ./meshcentral-desktop_${VER}_all.deb\`)"
            echo "- \`MeshCentralDesktop-${VER}-setup.exe\`: Windows 10 / 11 installer (per user, or all users)"
            echo "- \`MeshCentralDesktop-${VER}.msi\`: Windows installer for managed deployment (Group Policy, Intune)"
            echo "- \`MeshCentralDesktop-${VER}-portable.exe\`: Windows, single file, runs without installation"
            echo ""
            echo "The Windows files are a **preview** and are **not code-signed** yet: SmartScreen shows a warning (More info > Run anyway) and Windows 11 Smart App Control must be off. See docs/WINDOWS.md."
            echo "- \`MeshCentralDesktop-${VER}-android.apk\`: Android 8 or later, **preview** (allow installing from your browser or file manager). Signed with the CYVELION release key, certificate SHA-256 \`03:CC:BF:9E:D4:EA:3E:B9:8D:0D:25:81:85:20:1C:F5:20:46:AD:0E:A7:87:42:98:85:9B:C1:E2:C7:B5:A8:A0\`. See docs/ANDROID.md."
            echo "- \`meshcentral-desktop-${VER}.tar.gz\`, \`meshcentral-desktop-${VER}.zip\`: source code"
            echo "- \`SHA256SUMS\`: checksums, verify with \`sha256sum -c SHA256SUMS\`"
            echo "- Build provenance: \`gh attestation verify meshcentral-desktop_${VER}_all.deb --repo ${GITHUB_REPOSITORY} --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/ci.yml --source-ref refs/tags/${GITHUB_REF_NAME}\`"
          } > release-notes.md
          grep -q . release-notes.md

      - name: Attach package to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3
        with:
          name: MeshCentral Desktop ${{ github.ref_name }}
          files: |
            dist/*.deb
            dist/*.exe
            dist/*.msi
            dist/*.apk
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          body_path: release-notes.md
