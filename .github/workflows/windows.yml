name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege: building and testing need only read access.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    env:
      PYTHONUTF8: "1"     # UTF-8 stdout / files (the Windows default code page cannot print every character)
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Actions are pinned to full commit SHAs (a tag can be moved by the action's owner).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            unzip
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-python-websocket-client
            mingw-w64-ucrt-x86_64-python-comtypes
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-pyinstaller
            mingw-w64-ucrt-x86_64-pyinstaller-hooks-contrib

      # WebView2 SDK and xterm.js, pinned by version AND SHA-256 (see the script)
      - name: Third-party files
        run: scripts/windows/fetch-assets.sh

      - name: Syntax check
        run: python -m compileall -q pkg/usr/share/meshcentral-desktop scripts/windows

      - name: WebView2 inside GTK
        run: |
          export MCD_WEBVIEW2_DIR="$(cygpath -w "$PWD/build/webview2")"
          mkdir -p smoke && cd smoke
          timeout 180 python ../scripts/windows/webview2_smoke.py 2>&1 | tee smoke.log
          exit ${PIPESTATUS[0]}

      - name: Terminal (xterm.js in WebView2)
        run: |
          export MCD_WEBVIEW2_DIR="$(cygpath -w "$PWD/build/webview2")"
          export MCD_ASSETS_DIR="$(cygpath -w "$PWD/build/assets")"
          cd smoke
          timeout 180 python ../scripts/windows/terminal_smoke.py 2>&1 | tee terminal.log
          exit ${PIPESTATUS[0]}

      # ---- the whole app against a throwaway local MeshCentral server and a REAL Windows agent ----
      # (local to this CI run: the account below exists only here)
      - name: Local MeshCentral server (install)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force mc | Out-Null
          Set-Location mc
          npm install --no-audit --no-fund meshcentral@1.2.5 | Out-Null
          node node_modules/meshcentral/meshcentral --cert 127.0.0.1 --createaccount ciadmin --pass "Ci-Test-12345!"
          node node_modules/meshcentral/meshcentral --adminaccount ciadmin

      # One step: background processes do not survive the end of the step that started them.
      - name: App against the server and a real Windows agent
        run: |
          NODE="/c/Program Files/nodejs/node.exe"
          (cd mc && "$NODE" node_modules/meshcentral/meshcentral --cert 127.0.0.1 --port 8443 --redirport 8080 \
             --exactports > server.log 2> server.err &)
          for i in $(seq 1 120); do
            [ "$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:8443/)" = 200 ] && { echo "server up ($i)"; break; }
            sleep 2
          done
          python scripts/windows/ci_server.py https://127.0.0.1:8443 ciadmin 'Ci-Test-12345!' "$(cygpath -w "$PWD/agent")"
          (cd agent && ./meshagent.exe connect > agent.log 2> agent.err &)
          sleep 20
          export MCD_WEBVIEW2_DIR="$(cygpath -w "$PWD/build/webview2")"
          export MCD_ASSETS_DIR="$(cygpath -w "$PWD/build/assets")"
          cd smoke
          timeout 900 python ../scripts/windows/app_smoke.py https://127.0.0.1:8443 ciadmin 'Ci-Test-12345!' 2>&1 | tee app.log
          exit ${PIPESTATUS[0]}

      # ---- packaging: PyInstaller folder -> Inno Setup .exe + WiX .msi, each installed and self-tested ----
      - name: Bundle (PyInstaller)
        run: scripts/windows/build.sh

      - name: Self-test of the bundled app
        run: |
          ./dist/MeshCentralDesktop/MeshCentralDesktop.exe --selftest "$(cygpath -w "$PWD/smoke/selftest-bundle.json")" || rc=$?
          cat smoke/selftest-bundle.json | python -c "import json,sys;r=json.load(sys.stdin);[print(k, v if not isinstance(v,dict) else (v['ok'], v.get('value', v.get('error')))) for k,v in r.items() if k!='modules']"
          exit ${rc:-0}

      - name: Installers (Inno Setup .exe, WiX .msi)
        shell: pwsh
        run: |
          $ver = (Get-Content dist\VERSION).Trim()
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=$ver" packaging\windows\installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet tool install --global wix --version 5.0.2 | Out-Null
          wix extension add -g WixToolset.UI.wixext/5.0.2
          # absolute paths: WiX resolves relative ones from the .wxs folder
          wix build -arch x64 -ext WixToolset.UI.wixext -d Version=$ver -d "SourceDir=$PWD\dist\MeshCentralDesktop" `
            -d "Icon=$PWD\build\meshcentral-desktop.ico" -d "LicenseRtf=$PWD\build\LICENSE.rtf" `
            packaging\windows\MeshCentralDesktop.wxs -o "dist\MeshCentralDesktop-$ver.msi"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem dist\*.exe, dist\*.msi | Format-Table Name, Length
          foreach ($f in Get-ChildItem dist\*.exe, dist\*.msi) {
            if ($f.Length -lt 20MB) { "$($f.Name) is too small: the app folder was not packed"; exit 1 }
          }

      - name: Install, self-test and uninstall both installers
        shell: pwsh
        run: |
          $ver = (Get-Content dist\VERSION).Trim()
          $fail = 0
          # setup .exe, per-user, silent
          $dir = "$env:LOCALAPPDATA\Programs\MCD-CI"
          Start-Process "dist\MeshCentralDesktop-$ver-setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/DIR=$dir","/LOG=smoke\setup-install.log" -Wait
          Start-Process "$dir\MeshCentralDesktop.exe" -ArgumentList "--selftest","$PWD\smoke\selftest-setup.json" -Wait -PassThru | ForEach-Object { if ($_.ExitCode) { $fail = 1; "setup.exe install: self-test failed" } else { "setup.exe install: self-test OK" } }
          $unins = Get-ChildItem "$dir\unins*.exe" | Select-Object -First 1
          Start-Process $unins.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait
          if (Test-Path "$dir\MeshCentralDesktop.exe") { $fail = 1; "setup.exe: uninstall left the app behind" } else { "setup.exe: uninstalled" }
          # .msi, per-machine, silent
          $p = Start-Process msiexec -ArgumentList "/i","dist\MeshCentralDesktop-$ver.msi","/qn","/l*v","smoke\msi-install.log" -Wait -PassThru
          "msiexec install exit code: $($p.ExitCode)"; if ($p.ExitCode) { $fail = 1 }
          $exe = "$env:ProgramFiles\MeshCentral Desktop\MeshCentralDesktop.exe"
          Start-Process $exe -ArgumentList "--selftest","$PWD\smoke\selftest-msi.json" -Wait -PassThru | ForEach-Object { if ($_.ExitCode) { $fail = 1; ".msi install: self-test failed" } else { ".msi install: self-test OK" } }
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\MeshCentral Desktop.lnk")) { $fail = 1; ".msi: Start menu shortcut missing" } else { ".msi: Start menu shortcut OK" }
          $p = Start-Process msiexec -ArgumentList "/x","dist\MeshCentralDesktop-$ver.msi","/qn" -Wait -PassThru
          if ((Test-Path $exe) -or $p.ExitCode) { $fail = 1; ".msi: uninstall failed" } else { ".msi: uninstalled" }
          exit $fail

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: windows-installers
          path: |
            dist/*.exe
            dist/*.msi
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: windows-smoke
          path: |
            smoke/*.png
            smoke/*.log
            smoke/*.json
            mc/server.log
            mc/server.err
            agent/agent.log
            agent/agent.err
          if-no-files-found: ignore
