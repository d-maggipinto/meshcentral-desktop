name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege: building and testing need only read access.
permissions:
  contents: read

env:
  # Microsoft Edge WebView2 SDK (WebView2Loader.dll + WebView2.tlb), pinned by version AND checksum.
  WEBVIEW2_SDK_VERSION: "1.0.4258.31"
  WEBVIEW2_SDK_SHA256: "56f7f4b8bf9aee4b8efefbbdd4f67d5f74ebd1b100ed0806da71bf76af481aa9"

jobs:
  build:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Actions are pinned to full commit SHAs (a tag can be moved by the action's owner).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            unzip
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-python-websocket-client
            mingw-w64-ucrt-x86_64-python-comtypes
            mingw-w64-ucrt-x86_64-adwaita-icon-theme

      - name: WebView2 SDK
        run: |
          curl -sSfL -o wv2.nupkg "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/${WEBVIEW2_SDK_VERSION}"
          echo "${WEBVIEW2_SDK_SHA256}  wv2.nupkg" | sha256sum -c -
          mkdir -p build/webview2
          unzip -q -j -o wv2.nupkg "build/native/x64/WebView2Loader.dll" "WebView2.tlb" -d build/webview2
          ls -l build/webview2

      - name: Syntax check
        run: python -m compileall -q pkg/usr/share/meshcentral-desktop scripts/windows

      - name: WebView2 inside GTK
        run: |
          export MCD_WEBVIEW2_DIR="$(cygpath -w "$PWD/build/webview2")"
          mkdir -p smoke && cd smoke
          timeout 180 python ../scripts/windows/webview2_smoke.py 2>&1 | tee smoke.log
          exit ${PIPESTATUS[0]}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: windows-smoke
          path: |
            smoke/*.png
            smoke/*.log
          if-no-files-found: ignore
