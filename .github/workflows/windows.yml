name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege: building and testing need only read access.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    env:
      PYTHONUTF8: "1"     # UTF-8 stdout / files (the Windows default code page cannot print every character)
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Actions are pinned to full commit SHAs (a tag can be moved by the action's owner).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            unzip
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-python-websocket-client
            mingw-w64-ucrt-x86_64-python-comtypes
            mingw-w64-ucrt-x86_64-adwaita-icon-theme

      # WebView2 SDK and xterm.js, pinned by version AND SHA-256 (see the script)
      - name: Third-party files
        run: scripts/windows/fetch-assets.sh

      - name: Syntax check
        run: python -m compileall -q pkg/usr/share/meshcentral-desktop scripts/windows

      - name: WebView2 inside GTK
        run: |
          export MCD_WEBVIEW2_DIR="$(cygpath -w "$PWD/build/webview2")"
          mkdir -p smoke && cd smoke
          timeout 180 python ../scripts/windows/webview2_smoke.py 2>&1 | tee smoke.log
          exit ${PIPESTATUS[0]}

      - name: Terminal (xterm.js in WebView2)
        run: |
          export MCD_WEBVIEW2_DIR="$(cygpath -w "$PWD/build/webview2")"
          export MCD_ASSETS_DIR="$(cygpath -w "$PWD/build/assets")"
          cd smoke
          timeout 180 python ../scripts/windows/terminal_smoke.py 2>&1 | tee terminal.log
          exit ${PIPESTATUS[0]}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: windows-smoke
          path: |
            smoke/*.png
            smoke/*.log
          if-no-files-found: ignore
